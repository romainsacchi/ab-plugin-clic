[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ab-plugin-clic"
version = "0.1.0.dev0"
description = "Import published CLIC inventories into Activity Browser 3"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "requests>=2.32,<3",
    "bw2data>=4.8,<5",
    "bw2io>=0.9.17,<1",
    "qtpy>=2,<3",
    "keyring>=25.6,<26",
]

[project.entry-points."activity_browser.plugins"]
ab_clic = "ab_clic.activate:activate"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ab_clic = ["assets/clic-mark.svg"]
